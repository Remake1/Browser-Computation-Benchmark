# Production server for benchmark runs: Nginx serving web/dist with COOP/COEP.
#   cd web && npm run build && npm run serve:nginx   → http://localhost:8080
services:
  web:
    image: nginx:1.30.6-alpine
    ports:
      - "8080:80"
    volumes:
      - ../web/dist:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/isolation-headers.conf:/etc/nginx/snippets/isolation-headers.conf:ro
