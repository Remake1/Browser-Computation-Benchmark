# Cross-origin isolation (SharedArrayBuffer for WASM threads, fine-grained
# performance.now()). Included in *every* block that sets headers: nginx drops
# inherited add_header directives as soon as a block declares its own.
add_header Cross-Origin-Opener-Policy   "same-origin"  always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header Cross-Origin-Resource-Policy "same-origin"  always;
