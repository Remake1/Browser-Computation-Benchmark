# Serves the production build (web/dist) for benchmarking. Mounted by
# deploy/docker-compose.yml at /etc/nginx/conf.d/default.conf.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    include /etc/nginx/snippets/isolation-headers.conf;
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Content-hashed Vite output: safe to cache forever.
    location /assets/ {
        include /etc/nginx/snippets/isolation-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Emscripten output is not content-hashed, so always revalidate. Explicit MIME
    # types: module workers and dynamic import() reject non-JavaScript types, and
    # WebAssembly.instantiateStreaming requires application/wasm.
    location /wasm/ {
        include /etc/nginx/snippets/isolation-headers.conf;
        add_header Cache-Control "no-cache" always;
        location ~ \.mjs$ { types { } default_type text/javascript; }
        location ~ \.wasm$ { types { } default_type application/wasm; }
        try_files $uri =404;
    }
}
